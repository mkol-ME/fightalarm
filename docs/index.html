<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Alarm">
<title>Fight Alarm</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --ink: #16161a; --muted: #6d6d73; --line: #e3e1db;
    --accent: #d7341f; --accent-ink: #ffffff; --accent-soft: #fbe7e3; --ok: #1f7a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e10; --card: #19191c; --ink: #f1f1f3; --muted: #9b9ba3; --line: #2a2a2f; --accent: #ff5a3d; --accent-ink: #120402; --accent-soft: #2c1512; --ok: #4cc38a; }
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 88px);
  }
  main { max-width: 560px; margin: 0 auto; }
  header { padding: 20px 0 4px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-size: 24px; line-height: 1.15; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 4px; padding: 4px 16px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; width: 168px; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
  }
  .tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .tab .when { font-size: 12px; color: var(--muted); }
  .tab .what { font-weight: 650; font-size: 14px; line-height: 1.25; margin: 2px 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .pick { font-size: 12px; font-weight: 600; color: var(--accent); }
  .tab .pick.off { color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; display: flex; justify-content: space-between; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  label.bout { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  label.bout:first-child { border-top: 0; }
  label.bout input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; margin: 0; }
  .names { font-weight: 600; }
  .meta { font-size: 13px; color: var(--muted); }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
  .live { background: var(--accent); color: var(--accent-ink); }
  .final { border: 1px solid var(--line); color: var(--muted); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
  }
  .bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .status { flex: 1; font-size: 14px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  button.act { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 9px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  input[type=text] { font: inherit; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); margin: 12px 0; }
  .note { color: var(--muted); font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<main id="app"><header><div class="sub">Loading cards…</div></header></main>
<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <span class="status" id="status"></span>
    <button class="act" id="none">None</button>
    <button class="act" id="all">All</button>
  </div>
</div>
<script>
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard';
const DAYS_AHEAD = 31;
const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// The private picks topic comes from the URL (#topic) the first time, then localStorage.
let topic = decodeURIComponent(location.hash.slice(1)) || store.get('picksTopic');
if (location.hash.length > 1) store.set('picksTopic', topic);

let events = [];                         // upcoming ESPN events, soonest first
let picks = { updated: 0, events: {} };  // { updated, events: { [id]: { all: true } | { bouts: [...] } } }
let current;                             // the event being edited
let saveTimer;

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (ok ? ' ok' : '');
}

// Older single-event picks ({ eventId, bouts, all }) are converted.
function normalizePicks(p) {
  if (p?.events) return p;
  if (p?.eventId) return { updated: p.updated, events: { [p.eventId]: p } };
  return { updated: 0, events: {} };
}

// Must match picksKey() in fightalarm.mjs: saved picks live at picks/<key>.json.
async function picksKey(t) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
}

async function currentPicks() {
  const key = await picksKey(topic);
  const [saved, fresh] = await Promise.all([
    fetch(`picks/${key}.json`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`https://ntfy.sh/${encodeURIComponent(topic)}/json?poll=1&since=12h`).then(r => r.text()).then(t =>
      t.split('\n').filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === 'message')
        .map(m => { try { return JSON.parse(m.message); } catch { return null; } })
        .filter(p => p?.events || p?.eventId).at(-1) ?? null
    ).catch(() => null),
  ]);
  return normalizePicks((fresh?.updated ?? 0) > (saved?.updated ?? 0) ? fresh : saved);
}

function scoreboardUrl() {
  const ymd = d => d.toISOString().slice(0, 10).replace(/-/g, '');
  const now = Date.now();
  return `${ESPN}?dates=${ymd(new Date(now - 864e5))}-${ymd(new Date(now + DAYS_AHEAD * 864e5))}`;
}

const fmt = (d, opts) => new Date(d).toLocaleString([], opts ?? { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

function orderedBouts(e) {
  const comps = e.competitions;
  return comps.length > 1 && Date.parse(comps[0].date) > Date.parse(comps.at(-1).date) ? [...comps].reverse() : comps;
}

// Picked bout ids for an event, or null for "all" (nothing saved, or every fight ticked).
function pickedSet(e) {
  const p = picks.events[e.id];
  if (!p || p.all) return null;
  const ids = new Set(p.bouts);
  return e.competitions.every(c => ids.has(c.id)) ? null : ids;
}

function pickSummary(e) {
  const picked = pickedSet(e);
  if (!picked) return { text: 'All · segment alerts', off: false };
  if (!picked.size) return { text: 'Off', off: true };
  return { text: `${picked.size} picked`, off: false };
}

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = events.map(e => {
    const [prefix, headline] = e.name.includes(': ') ? e.name.split(': ') : ['UFC', e.name];
    const s = pickSummary(e);
    return `<button class="tab" role="tab" data-id="${esc(e.id)}" aria-selected="${e.id === current.id}">
      <div class="when">${esc(fmt(e.date, { weekday: 'short', month: 'short', day: 'numeric' }))} · ${esc(prefix.replace('UFC Fight Night', 'Fight Night'))}</div>
      <div class="what">${esc(headline)}</div>
      <div class="pick${s.off ? ' off' : ''}">${esc(s.text)}</div></button>`;
  }).join('');
}

function segmentLabel(i, count) {
  return i === count - 1 ? 'Main card' : i === count - 2 ? 'Prelims' : 'Early prelims';
}

function boutRow(c, checked) {
  const names = c.competitors.map(x => esc(x.athlete?.displayName ?? 'TBA')).join(' <span class="meta">vs</span> ');
  const st = c.status.type;
  const winner = c.competitors.find(x => x.winner)?.athlete?.displayName;
  const badge = st.state === 'in' ? '<span class="badge live">LIVE</span>'
    : st.state === 'post' ? '<span class="badge final">FINAL</span>' : '';
  const meta = esc(c.type?.abbreviation ?? '') + (winner ? ` · ${esc(winner)} won` : '');
  return `<label class="bout"><input type="checkbox" value="${esc(c.id)}"${checked ? ' checked' : ''}>
    <span><span class="names">${names}</span>${badge}<br><span class="meta">${meta}</span></span></label>`;
}

function renderCard() {
  const comps = orderedBouts(current);
  const picked = pickedSet(current);
  const times = [...new Set(comps.map(c => c.date))].sort();
  // Main event first within each segment reads like a fight poster.
  const sections = times.map((t, i) => ({ t, label: segmentLabel(i, times.length), bouts: comps.filter(c => c.date === t).reverse() })).reverse();
  document.getElementById('card').innerHTML = `
    <h1>${esc(current.name)}</h1>
    <div class="sub">${esc(fmt(times[0]))} · ${comps.length} fights announced</div>
    ${sections.map(s => `
      <h2><span>${s.label}</span><span>${esc(fmt(s.t))}</span></h2>
      <div class="card">${s.bouts.map(c => boutRow(c, !picked || picked.has(c.id))).join('')}</div>`).join('')}
    <p class="note">Checked fights get an <b>UP NEXT</b> alert when the fight before them ends (~10 min warning), plus LIVE and result alerts.
    With <b>every</b> fight checked you only get one alert per segment instead, and fights announced later are included automatically. <b>None</b> turns this card off. Changes save automatically.</p>`;
  setStatus(pickSummary(current).text);
}

function render() {
  app.innerHTML = `
    <header><div class="eyebrow">Fight Alarm</div><div class="sub">UFC cards in the next ${DAYS_AHEAD} days</div></header>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section id="card"></section>`;
  renderTabs();
  renderCard();
  document.getElementById('bar').hidden = false;
}

function select(id) {
  current = events.find(e => e.id === id) ?? events[0];
  store.set('event', current.id);
  renderTabs();
  renderCard();
  window.scrollTo({ top: 0 });
}

function checkedIds() {
  return [...document.querySelectorAll('#card input[type=checkbox]:checked')].map(i => i.value);
}

function queueSave() {
  setStatus('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}

async function save() {
  const bouts = checkedIds();
  const all = bouts.length === current.competitions.length;
  // Publish the whole picks map (dropping past events) so the latest message is always complete.
  const upcoming = new Set(events.map(e => e.id));
  const next = { updated: Date.now(), events: {} };
  for (const [id, p] of Object.entries(picks.events)) if (upcoming.has(id)) next.events[id] = p;
  next.events[current.id] = all ? { all: true } : { bouts };
  try {
    const res = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}`, { method: 'POST', body: JSON.stringify(next) });
    if (!res.ok) throw new Error(res.status);
    picks = next;
    renderTabs();
    setStatus(`Saved · ${pickSummary(current).text}`, true);
  } catch {
    setStatus('Save failed, check connection');
  }
}

function setAll(on) {
  document.querySelectorAll('#card input[type=checkbox]').forEach(i => { i.checked = on; });
  queueSave();
}

function askForTopic() {
  app.innerHTML = `<header><div class="eyebrow">Fight Alarm</div><h1>Setup</h1>
    <div class="sub">Enter your private picks topic (PICKS_TOPIC).</div></header>
    <input type="text" id="topic" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="fightpicks-…">
    <button class="act primary" id="go">Save</button>`;
  document.getElementById('go').onclick = () => {
    topic = document.getElementById('topic').value.trim();
    if (!topic) return;
    store.set('picksTopic', topic);
    start();
  };
}

function message(title, sub) {
  app.innerHTML = `<header><div class="eyebrow">Fight Alarm</div><h1>${title}</h1><div class="sub">${sub}</div></header>`;
}

async function start() {
  if (!topic) return askForTopic();
  try {
    const [data, saved] = await Promise.all([fetch(scoreboardUrl(), { cache: 'no-store' }).then(r => r.json()), currentPicks()]);
    picks = saved;
    events = data.events
      .filter(e => e.competitions.length && e.competitions.some(c => c.status.type.state !== 'post'))
      .sort((a, b) => Date.parse(a.date) - Date.parse(b.date));
    if (!events.length) return message('No upcoming cards', `ESPN hasn't posted any cards in the next ${DAYS_AHEAD} days.`);
    current = events.find(e => e.id === store.get('event')) ?? events[0];
    render();
  } catch (err) {
    console.error(err);
    message('Couldn\'t load cards', 'Close and reopen to try again.');
  }
}

app.addEventListener('change', e => { if (e.target.type === 'checkbox') queueSave(); });
app.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab && tab.dataset.id !== current.id) {
    clearTimeout(saveTimer); // flush a pending save for the card being left
    if (statusEl.textContent === 'Saving…') save().then(() => select(tab.dataset.id));
    else select(tab.dataset.id);
  }
});
document.getElementById('all').onclick = () => setAll(true);
document.getElementById('none').onclick = () => setAll(false);
start();
</script>
</body>
</html>

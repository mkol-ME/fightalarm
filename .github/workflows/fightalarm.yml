name: fight-alarm

on:
  schedule:
    # GitHub skips scheduled runs often, so this only needs to land once in the
    # 30h before a card; that run then stays on and hands off to fresh runs.
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: fight-alarm
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - id: watch
        run: node fightalarm.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PICKS_TOPIC: ${{ secrets.PICKS_TOPIC }}
          FRIENDS: ${{ secrets.FRIENDS }}
          MAX_RUN_MIN: ${{ vars.MAX_RUN_MIN }} # unset normally; tiny values test the hand-off
      - name: Report failure
        if: failure()
        run: |
          curl -s -o /dev/null -H "Title: Fight alarm broke" -H "Priority: 4" -H "Tags: warning" \
            -d "A run failed. Alerts may not fire until it's fixed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
      - name: Save picks
        if: always()
        run: |
          git add -A docs/picks
          git diff --cached --quiet && exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Save fight picks"
          git pull --rebase && git push
      - name: Hand off to a fresh run
        if: always() && steps.watch.outputs.continue == 'true'
        run: gh workflow run fightalarm.yml -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
